<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            color: #d63384;
            font-size: 26px;
            margin-bottom: 15px;
        }
        p {
            color: #4a4a4a;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .heart-btn {
            background-color: #e83e8c;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(232, 62, 140, 0.4);
            transition: transform 0.2s, background 0.3s;
        }
        .heart-btn:hover {
            transform: scale(1.05);
            background-color: #d63384;
        }
        .heart {
            position: absolute;
            color: #ff4757;
            font-size: 20px;
            animation: floatUp 4s linear infinite;
            opacity: 0.8;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌸 Chúc Mừng 20/10 🌸</h1>
        <p>
            Nhân ngày Phụ nữ Việt Nam, chúc mẹ luôn dồi dào sức khỏe, bình an và tươi vui mỗi ngày. Mong mẹ luôn hạnh phúc không còn ưu phiền nữa! ❤️
        </p>
        <button class="heart-btn" onclick="addHearts()">Gửi Ngàn Trái Tim ❤️</button>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 300);

        function addHearts() {
            for(let i = 0; i < 15; i++) {
                setTimeout(createHeart, i * 100);
            }
        }
    </script>
</body>
</html>
