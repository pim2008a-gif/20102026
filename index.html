<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 20/10 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle, #1a001a 0%, #0d000d 100%);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .neon-bg {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 0, 128, 0.25);
            filter: blur(120px);
            border-radius: 50%;
            z-index: 1;
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.4); opacity: 0.8; }
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 25px;
            border-radius: 25px;
            box-shadow: 0 0 40px rgba(255, 0, 128, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05);
            text-align: center;
            max-width: 420px;
            width: 90%;
            z-index: 10;
            animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #ff3399;
            font-size: 45px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 51, 153, 0.6);
        }

        p {
            color: #f1f1f1;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .firework-btn {
            background: linear-gradient(45deg, #ff3399, #ff66b2);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(255, 51, 153, 0.5);
            transition: all 0.3s ease;
        }

        .firework-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(255, 51, 153, 0.8);
            background: linear-gradient(45deg, #ff1a8c, #ff4da6);
        }

        .music-control {
            margin-top: 15px;
            font-size: 13px;
            color: #ff99cc;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
        }

        .heart {
            position: absolute;
            color: #ff3399;
            font-size: 22px;
            animation: floatUp 5s linear infinite;
            z-index: 2;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0.4) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.3) rotate(360deg); opacity: 0; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="neon-bg"></div>

    <!-- Nhạc nền không lời lãng mạn -->
    <audio id="bg-music" loop autoplay>
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-sensations-491.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <h1>Happy 20/10 ✨</h1>
        <p>
            Chúc người phụ nữ tuyệt vời của cuộc đời con/anh luôn rực rỡ, ngập tràn hạnh phúc, mãi xinh đẹp và vạn sự như ý! 💖
        </p>
        <button class="firework-btn" onclick="triggerMagic()">Bấm Vào Đây Xem Pháo Hoa 🎆</button>
        <br>
        <button class="music-control" onclick="toggleMusic()">🔇 Bật/Tắt Nhạc Nền</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.min.js"></script>
